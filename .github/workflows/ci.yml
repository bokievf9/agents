name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm -r build

  image-lead-intake:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/lead-intake/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agents-lead-intake:latest
            ghcr.io/${{ github.repository_owner }}/agents-lead-intake:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lead-intake:
    # Enabled once the VPS is bootstrapped (deploy/bootstrap-vps.sh, forced-command key, as in Dono):
    # set repository variable DEPLOY_ENABLED=true. Secrets AGENTS_SSH_KEY, VPS_HOST, VPS_KNOWN_HOSTS
    # live in the `production` Environment, not in repo secrets.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image-lead-intake
    runs-on: ubuntu-latest
    # Secrets live in the `production` environment, restricted to the main branch.
    environment: production
    concurrency:
      group: deploy-lead-intake
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.AGENTS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_agents && chmod 600 ~/.ssh/id_agents
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy (forced command on the server pulls the image and restarts)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/id_agents -o IdentitiesOnly=yes agents@"$HOST"

# 14 дней: у каждого дня 3 новых слова (их разбор, пиньинь, тоны и пример лежат в words-*.yaml),
# мини-диалог, 3 вопроса проверки. Диалог: who, h (иероглифы), p (пиньинь), r (перевод),
# card: true делает фразу карточкой для повторения. quiz: q, o (варианты), a (номер верного, с нуля), why.
- day: 1
  title: "Привет и спасибо"
  situation: acquaintance
  intro: "Начинаем с трёх слов, которые откроют любой разговор. Сегодня же услышишь четыре тона: в китайском тон меняет смысл слова."
  tone_tip: "Четыре тона: 1 ровный высокий (mā), 2 вверх (má), 3 вниз-вверх (mǎ), 4 резко вниз (mà). Нейтральный тон: короткий, без знака."
  words: [你好, 谢谢, 再见]
  dialog:
    title: "Первая встреча"
    note: "你好: универсальное «здравствуйте». 谢谢 отвечают 不客气. Вежливо прощаются словом 再见."
    lines:
      - {who: "Вы", h: "你好！", p: "nǐ hǎo!", r: "Здравствуйте!"}
      - {who: "Собеседник", h: "你好，很高兴认识你。", p: "nǐ hǎo, hěn gāoxìng rènshi nǐ.", r: "Здравствуйте, рад познакомиться.", card: true}
      - {who: "Вы", h: "谢谢！", p: "xièxie!", r: "Спасибо!"}
      - {who: "Собеседник", h: "不客气，再见！", p: "bú kèqi, zàijiàn!", r: "Не за что, до свидания!"}
  quiz:
    - {q: "Что значит 你好 (nǐ hǎo)?", o: ["до свидания", "здравствуйте", "спасибо"], a: 1}
    - {q: "Как ответить на 谢谢?", o: ["再见", "你好", "不客气"], a: 2, why: "不客气: «не за что»."}
    - {q: "Как сказать «до свидания»?", o: ["再见", "谢谢", "对不起"], a: 0}
- day: 2
  title: "Как тебя зовут"
  situation: acquaintance
  intro: "Сегодня учимся назвать себя и спросить имя собеседника. Фраза-шаблон: 我叫… («я зовусь…»)."
  tone_tip: "Слово 我 (wǒ) и 你 (nǐ) 3-го тона: голос идёт вниз и чуть вверх. Лёгкий слог в 名字 произносится коротко."
  words: [我, 叫, 名字]
  dialog:
    title: "Знакомство"
    note: "我叫 + имя: назвать себя. 你叫什么名字？: спросить имя. Лёгкий слог в конце не имеет тона."
    lines:
      - {who: "Вы", h: "你好，我叫阿里。你叫什么名字？", p: "nǐ hǎo, wǒ jiào Ālǐ. nǐ jiào shénme míngzi?", r: "Здравствуйте, меня зовут Али. А вас как зовут?", card: true}
      - {who: "Собеседник", h: "我叫玛丽。", p: "wǒ jiào Mǎlì.", r: "Меня зовут Мэри."}
      - {who: "Вы", h: "认识你很高兴！", p: "rènshi nǐ hěn gāoxìng!", r: "Очень приятно познакомиться!"}
      - {who: "Собеседник", h: "我也很高兴。", p: "wǒ yě hěn gāoxìng.", r: "Мне тоже очень приятно."}
  quiz:
    - {q: "Как сказать «меня зовут…»?", o: ["我叫…", "你好…", "谢谢…"], a: 0}
    - {q: "Что значит 名字 (míngzi)?", o: ["страна", "имя", "друг"], a: 1}
    - {q: "Как спросить «как тебя зовут?»", o: ["你好吗？", "你叫什么名字？", "你在哪儿？"], a: 1}
- day: 3
  title: "Откуда ты"
  situation: acquaintance
  intro: "Сегодня: «быть», «не» и «человек». Из них собирается рассказ о том, кто ты и откуда."
  tone_tip: "Тон 不 меняется: перед словом 4-го тона он читается bú (不是 bú shì), в остальных случаях bù."
  words: [是, 不, 人]
  dialog:
    title: "Откуда ты?"
    note: "是 связывает: 我是中国人 «я китаец». 不是: «не есть». 你呢？: встречный вопрос «а ты?». 会一点: «немного умею»."
    lines:
      - {who: "Собеседник", h: "你是哪国人？", p: "nǐ shì nǎ guó rén?", r: "Ты из какой страны?"}
      - {who: "Вы", h: "我是俄罗斯人。你呢？", p: "wǒ shì Èluósī rén. nǐ ne?", r: "Я из России. А ты?", card: true}
      - {who: "Собеседник", h: "我是中国人。你会说英语吗？", p: "wǒ shì Zhōngguó rén. nǐ huì shuō Yīngyǔ ma?", r: "Я из Китая. Ты говоришь по-английски?"}
      - {who: "Вы", h: "会一点。", p: "huì yìdiǎn.", r: "Немного.", card: true}
  quiz:
    - {q: "Что значит 人 (rén)?", o: ["человек", "страна", "имя"], a: 0}
    - {q: "Как сказать «я не китаец»?", o: ["我是中国人", "我不是中国人", "我叫中国人"], a: 1, why: "不是: «не есть»."}
    - {q: "Что значит 你呢？", o: ["Сколько стоит?", "Где ты?", "А ты?"], a: 2}
- day: 4
  title: "Вода и чай"
  situation: cafe
  intro: "Заходим в кафе. Три слова, и ты уже сделаешь заказ: «хочу», «вода», «чай»."
  tone_tip: "水 (shuǐ) и 茶 (chá): третий и второй тон. Не путай: shuǐ идёт вниз-вверх, chá только вверх."
  words: [要, 水, 茶]
  dialog:
    title: "Заказ напитков"
    note: "我要 + что: заказ. 一杯: «один стакан/чашка». 好的: «хорошо, понял»."
    lines:
      - {who: "Официант", h: "欢迎！你要什么？", p: "huānyíng! nǐ yào shénme?", r: "Добро пожаловать! Что будете?"}
      - {who: "Вы", h: "我要一杯茶。", p: "wǒ yào yì bēi chá.", r: "Мне чашку чая.", card: true}
      - {who: "Официант", h: "要水吗？", p: "yào shuǐ ma?", r: "Воду будете?"}
      - {who: "Вы", h: "要，请给我一杯水。", p: "yào, qǐng gěi wǒ yì bēi shuǐ.", r: "Да, дайте, пожалуйста, стакан воды.", card: true}
      - {who: "Официант", h: "好的。", p: "hǎo de.", r: "Хорошо."}
  quiz:
    - {q: "Что значит 水 (shuǐ)?", o: ["чай", "вода", "кофе"], a: 1}
    - {q: "Как заказать чай?", o: ["我要茶", "我是茶", "我叫茶"], a: 0}
    - {q: "Что значит 要 (yào)?", o: ["хочу, мне нужно", "не", "спасибо"], a: 0}
- day: 5
  title: "Вкусно!"
  situation: cafe
  intro: "Учимся сказать, что хочешь есть, и похвалить еду. 吃 и 饭 слышны в Китае каждый день."
  tone_tip: "吃 (chī) 1-го тона звучит ровно и высоко, 饭 (fàn) резко падает. 好吃 (hǎochī): 3-й и 1-й тон."
  words: [吃, 饭, 好吃]
  dialog:
    title: "Что у вас вкусное?"
    note: "不 перед 吃 (1-й тон) читается bù: 我不吃辣 «острое не ем». 辣: острое."
    lines:
      - {who: "Вы", h: "你们这儿什么好吃？", p: "nǐmen zhèr shénme hǎochī?", r: "А что у вас вкусное?"}
      - {who: "Официант", h: "饺子很好吃。", p: "jiǎozi hěn hǎochī.", r: "Пельмени очень вкусные."}
      - {who: "Вы", h: "好，我想吃饺子。", p: "hǎo, wǒ xiǎng chī jiǎozi.", r: "Хорошо, хочу пельмени.", card: true}
      - {who: "Официант", h: "你吃辣吗？", p: "nǐ chī là ma?", r: "Острое едите?"}
      - {who: "Вы", h: "我不吃辣。", p: "wǒ bù chī là.", r: "Острое не ем.", card: true}
  quiz:
    - {q: "Что значит 好吃 (hǎochī)?", o: ["вкусный", "горячий", "дорогой"], a: 0}
    - {q: "Как сказать «хочу есть лапшу»?", o: ["我想吃面条", "我想喝面条", "我想买面条"], a: 0}
    - {q: "Что значит 我不吃辣?", o: ["Я люблю острое", "Острое не ем", "Мне дорого"], a: 1}
- day: 6
  title: "Меню и счёт"
  situation: cafe
  intro: "Последний шаг в кафе: попросить меню, узнать цену и оплатить. Три слова на каждый момент."
  tone_tip: "买单 (mǎidān): 3-й тон, затем 1-й. В 多少钱 слог shao лёгкий, а 钱 (qián) идёт вверх."
  words: [菜单, 买单, 多少钱]
  dialog:
    title: "Счёт"
    note: "买单: попросить счёт. 一共: «всего». 八十五块: 80 + 5 юаней. 刷卡: оплатить картой."
    lines:
      - {who: "Вы", h: "服务员，买单！", p: "fúwùyuán, mǎidān!", r: "Официант, счёт!"}
      - {who: "Официант", h: "一共八十五块。", p: "yígòng bāshíwǔ kuài.", r: "Всего 85 юаней."}
      - {who: "Вы", h: "可以刷卡吗？", p: "kěyǐ shuā kǎ ma?", r: "Можно картой?", card: true}
      - {who: "Официант", h: "可以。", p: "kěyǐ.", r: "Можно."}
      - {who: "Вы", h: "谢谢，很好吃！", p: "xièxie, hěn hǎochī!", r: "Спасибо, очень вкусно!"}
  quiz:
    - {q: "Что значит 菜单 (càidān)?", o: ["счёт", "меню", "официант"], a: 1}
    - {q: "Как попросить счёт?", o: ["买单！", "再见！", "请问！"], a: 0}
    - {q: "Что значит 一共八十五块?", o: ["Всего 58 юаней", "Всего 85 юаней", "Всего 80 юаней"], a: 1, why: "八十五 = 80 + 5."}
- day: 7
  title: "В такси"
  situation: taxi
  intro: "Садимся в такси. Покажи адрес в телефоне и скажи: «Мне сюда»."
  tone_tip: "Оба слога в 酒店 (jiǔdiàn): 3-й тон перед 4-м читается коротко и низко, без подъёма."
  words: [去, 这里, 酒店]
  dialog:
    title: "Куда едем"
    note: "去哪儿？: «куда?». 到… 远吗？: «до… далеко?». 分钟: «минута» (длительность)."
    lines:
      - {who: "Водитель", h: "你好，去哪儿？", p: "nǐ hǎo, qù nǎr?", r: "Здравствуйте, куда?"}
      - {who: "Вы", h: "我要去这个酒店。", p: "wǒ yào qù zhège jiǔdiàn.", r: "Мне в этот отель.", card: true}
      - {who: "Водитель", h: "好的。", p: "hǎo de.", r: "Хорошо."}
      - {who: "Вы", h: "到酒店远吗？", p: "dào jiǔdiàn yuǎn ma?", r: "До отеля далеко?"}
      - {who: "Водитель", h: "不远，十分钟。", p: "bù yuǎn, shí fēnzhōng.", r: "Недалеко, десять минут."}
  quiz:
    - {q: "Что значит 酒店 (jiǔdiàn)?", o: ["аэропорт", "отель", "метро"], a: 1}
    - {q: "Как сказать «мне нужно в аэропорт»?", o: ["我要去机场", "我要买机场", "我要吃机场"], a: 0}
    - {q: "Что значит 不远，十分钟?", o: ["Далеко, десять минут", "Недалеко, десять минут", "Недалеко, пять минут"], a: 1}
- day: 8
  title: "Налево, направо, стоп"
  situation: taxi
  intro: "Учимся направлять водителя. Три команды: налево, направо, остановитесь."
  tone_tip: "左 (zuǒ) 3-й тон и 右 (yòu) 4-й: легко спутать на слух. Запомни: лево идёт вниз-вверх, право только вниз."
  words: [左, 右, 停]
  dialog:
    title: "Остановитесь здесь"
    note: "师傅: вежливое обращение к водителю. 然后: «потом». 到了: «приехали»."
    lines:
      - {who: "Вы", h: "师傅，前面左拐，然后右拐。", p: "shīfu, qiánmiàn zuǒ guǎi, ránhòu yòu guǎi.", r: "Водитель, впереди налево, потом направо."}
      - {who: "Водитель", h: "好的。", p: "hǎo de.", r: "Хорошо."}
      - {who: "Вы", h: "请慢一点。", p: "qǐng màn yìdiǎn.", r: "Помедленнее, пожалуйста.", card: true}
      - {who: "Водитель", h: "到了。", p: "dào le.", r: "Приехали."}
      - {who: "Вы", h: "在这儿停，谢谢！", p: "zài zhèr tíng, xièxie!", r: "Остановите здесь, спасибо!", card: true}
  quiz:
    - {q: "Что значит 左 (zuǒ)?", o: ["направо", "налево", "прямо"], a: 1}
    - {q: "Как сказать «остановите здесь»?", o: ["在这儿停", "往左拐", "去机场"], a: 0}
    - {q: "Что значит 右 (yòu)?", o: ["левый", "задний", "правый"], a: 2}
- day: 9
  title: "Где метро"
  situation: road
  intro: "Спрашиваем дорогу. Формула: место + 在哪儿？ Это спасёт в любом городе."
  tone_tip: "在 (zài) и 再 (zài) звучат одинаково: на слух различает только смысл. 哪儿 (nǎr) с лёгкой «р» в конце."
  words: [在, 哪儿, 地铁站]
  dialog:
    title: "Спрашиваем дорогу"
    note: "一直走: «идти прямо». 然后左拐: «потом налево». 不远: «недалеко»."
    lines:
      - {who: "Вы", h: "请问，地铁站在哪儿？", p: "qǐngwèn, dìtiězhàn zài nǎr?", r: "Извините, где станция метро?", card: true}
      - {who: "Прохожий", h: "一直走，然后左拐。", p: "yìzhí zǒu, ránhòu zuǒ guǎi.", r: "Идите прямо, потом налево."}
      - {who: "Вы", h: "远吗？", p: "yuǎn ma?", r: "Далеко?"}
      - {who: "Прохожий", h: "不远，五分钟。", p: "bù yuǎn, wǔ fēnzhōng.", r: "Недалеко, пять минут."}
      - {who: "Вы", h: "谢谢！", p: "xièxie!", r: "Спасибо!"}
  quiz:
    - {q: "Как спросить «где туалет?»", o: ["厕所在哪儿？", "厕所多少钱？", "厕所好吃吗？"], a: 0}
    - {q: "Что значит 一直走?", o: ["повернуть налево", "идти прямо", "остановиться"], a: 1}
    - {q: "Что значит 不远?", o: ["недалеко", "дорого", "горячо"], a: 0}
- day: 10
  title: "Сколько стоит"
  situation: shop
  intro: "Торг и цены. Три слова: «это», «дорого», «дёшево». Китайские продавцы любят, когда спрашивают о скидке."
  tone_tip: "贵 (guì) 4-й тон, как резкое «дорого!». 便宜 (piányi): 2-й тон и лёгкий слог."
  words: [这个, 贵, 便宜]
  dialog:
    title: "Торг"
    note: "太…了: «слишком…». 便宜一点: «чуть дешевле». 怎么样？: «как вам?»"
    lines:
      - {who: "Вы", h: "这个多少钱？", p: "zhège duōshao qián?", r: "Сколько это стоит?"}
      - {who: "Продавец", h: "一百块。", p: "yìbǎi kuài.", r: "Сто юаней."}
      - {who: "Вы", h: "太贵了！便宜一点，可以吗？", p: "tài guì le! piányi yìdiǎn, kěyǐ ma?", r: "Слишком дорого! Можно подешевле?", card: true}
      - {who: "Продавец", h: "八十，怎么样？", p: "bāshí, zěnmeyàng?", r: "Восемьдесят, как вам?"}
      - {who: "Вы", h: "好的，我要这个。", p: "hǎo de, wǒ yào zhège.", r: "Хорошо, я возьму это."}
  quiz:
    - {q: "Что значит 太贵了?", o: ["Слишком дорого", "Очень вкусно", "Очень близко"], a: 0}
    - {q: "Как попросить скидку?", o: ["便宜一点", "再见", "买单"], a: 0}
    - {q: "Что значит 便宜?", o: ["дорогой", "дешёвый", "красивый"], a: 1}
- day: 11
  title: "Хочу купить"
  situation: shop
  intro: "Говорим, что хотим купить, и спрашиваем, можно ли. Слово 可以 открывает много дверей."
  tone_tip: "买 (mǎi) 3-й тон и 卖 (mài) 4-й: купить и продавать различаются только тоном. Запомни пару."
  words: [想, 买, 可以]
  dialog:
    title: "Что купить"
    note: "我想买…: «я хочу купить…». 欢迎光临: «добро пожаловать» (приветствие в магазине). 可以…吗？: «можно ли…»"
    lines:
      - {who: "Продавец", h: "欢迎光临！你想买什么？", p: "huānyíng guānglín! nǐ xiǎng mǎi shénme?", r: "Добро пожаловать! Что желаете купить?"}
      - {who: "Вы", h: "我想买一个包。", p: "wǒ xiǎng mǎi yí ge bāo.", r: "Я хочу купить сумку.", card: true}
      - {who: "Продавец", h: "这个怎么样？有黑色的。", p: "zhège zěnmeyàng? yǒu hēisè de.", r: "Как вам эта? Есть чёрная."}
      - {who: "Вы", h: "可以看一下吗？", p: "kěyǐ kàn yíxià ma?", r: "Можно посмотреть?", card: true}
      - {who: "Продавец", h: "可以。", p: "kěyǐ.", r: "Можно."}
  quiz:
    - {q: "Что значит 买 (mǎi)?", o: ["продавать", "покупать", "хотеть"], a: 1}
    - {q: "Как спросить «можно картой?»", o: ["可以刷卡吗？", "可以去吗？", "可以吃吗？"], a: 0}
    - {q: "Чем 卖 отличается от 买?", o: ["Он значит «продавать», тон 4-й", "Он значит «покупать», тон 3-й", "Это одно и то же слово"], a: 0}
- day: 12
  title: "Бронь и паспорт"
  situation: hotel
  intro: "Приехали в отель. Три слова для стойки регистрации: номер, бронь, паспорт."
  tone_tip: "护照 (hùzhào) и 预订 (yùdìng): сплошное падение, 4-й тон подряд. Говори отрывисто."
  words: [房间, 预订, 护照]
  dialog:
    title: "На стойке"
    note: "请给我…: «дайте мне, пожалуйста…». 对吗？: «верно?». 房卡: карта-ключ."
    lines:
      - {who: "Вы", h: "你好，我有预订。", p: "nǐ hǎo, wǒ yǒu yùdìng.", r: "Здравствуйте, у меня есть бронь.", card: true}
      - {who: "Ресепшен", h: "请给我您的护照。", p: "qǐng gěi wǒ nín de hùzhào.", r: "Дайте, пожалуйста, ваш паспорт."}
      - {who: "Вы", h: "这是我的护照。", p: "zhè shì wǒ de hùzhào.", r: "Вот мой паспорт."}
      - {who: "Ресепшен", h: "您订了一个房间，对吗？", p: "nín dìng le yí ge fángjiān, duì ma?", r: "Вы бронировали один номер, верно?"}
      - {who: "Вы", h: "对。", p: "duì.", r: "Верно."}
  quiz:
    - {q: "Что значит 护照 (hùzhào)?", o: ["ключ", "паспорт", "завтрак"], a: 1}
    - {q: "Как сказать «у меня есть бронь»?", o: ["我有预订", "我要预订", "我叫预订"], a: 0}
    - {q: "Что значит 房间?", o: ["номер, комната", "этаж", "лифт"], a: 0}
- day: 13
  title: "Заселение"
  situation: hotel
  intro: "Узнаём, сколько ночей, во сколько завтрак, и что делать с ключом."
  tone_tip: "住 (zhù) 4-й тон. 钥匙 (yàoshi): первый слог падает, второй лёгкий."
  words: [住, 早餐, 钥匙]
  dialog:
    title: "Заселение"
    note: "几: «сколько» (небольшое число). 晚 в счёте ночей. 密码: пароль. 无线网: вай-фай."
    lines:
      - {who: "Ресепшен", h: "您住几晚？", p: "nín zhù jǐ wǎn?", r: "На сколько ночей вы остановитесь?"}
      - {who: "Вы", h: "我住三晚。", p: "wǒ zhù sān wǎn.", r: "Я останусь на три ночи.", card: true}
      - {who: "Ресепшен", h: "早餐在二楼，七点到十点。", p: "zǎocān zài èr lóu, qī diǎn dào shí diǎn.", r: "Завтрак на втором этаже, с семи до десяти."}
      - {who: "Вы", h: "房间有无线网吗？", p: "fángjiān yǒu wúxiànwǎng ma?", r: "В номере есть вай-фай?", card: true}
      - {who: "Ресепшен", h: "有，密码在这里。", p: "yǒu, mìmǎ zài zhèlǐ.", r: "Есть, пароль здесь."}
  quiz:
    - {q: "Что значит 早餐?", o: ["ужин", "завтрак", "обед"], a: 1}
    - {q: "Как сказать «я останусь на три ночи»?", o: ["我住三晚", "我吃三晚", "我买三晚"], a: 0}
    - {q: "Что значит 钥匙?", o: ["паспорт", "ключ", "полотенце"], a: 1}
- day: 14
  title: "Вежливость и повторение"
  situation: polite
  intro: "Последний день первых двух недель. Три слова вежливости, и потом проверим всё, что прошли."
  tone_tip: "对不起 (duìbuqǐ): 4-й, лёгкий, 3-й. 没关系 (méi guānxi): 2-й, 1-й, лёгкий. Ритм такой же, как в русском «ничего страшного»."
  words: [请问, 对不起, 没关系]
  dialog:
    title: "Вежливо спросить"
    note: "请问: начало вопроса незнакомому. 对不起: извинение. 没关系: «ничего». 不知道: «не знаю»."
    lines:
      - {who: "Вы", h: "请问，厕所在哪儿？", p: "qǐngwèn, cèsuǒ zài nǎr?", r: "Извините, где туалет?", card: true}
      - {who: "Прохожий", h: "对不起，我不知道。", p: "duìbuqǐ, wǒ bù zhīdào.", r: "Простите, я не знаю."}
      - {who: "Вы", h: "没关系，谢谢！", p: "méi guānxi, xièxie!", r: "Ничего, спасибо!"}
      - {who: "Прохожий", h: "不客气，再见！", p: "bú kèqi, zàijiàn!", r: "Не за что, до свидания!"}
  quiz:
    - {q: "Что значит 对不起?", o: ["простите", "спасибо", "здравствуйте"], a: 0}
    - {q: "Как вежливо начать вопрос незнакомому человеку?", o: ["请问", "再见", "买单"], a: 0}
    - {q: "Что вы ответите на 对不起?", o: ["没关系", "多少钱", "我要茶"], a: 0}

# Тест уровня для нуля, 5 минут: пиньинь и тоны, 10 слов, 3 фразы.
# Слова: показываем иероглиф, 4 варианта перевода (неверные берутся из словаря). Фразы: варианты в файле.
pinyin:
  - {q: "Сколько в китайском основных тонов (без лёгкого)?", o: ["2", "3", "4", "5"], a: 2}
  - {q: "Какой это тон: mǎ?", o: ["1-й, ровный", "2-й, вверх", "3-й, вниз-вверх", "4-й, вниз"], a: 2}
  - {q: "Какой слог читается ровным высоким тоном?", o: ["má", "mā", "mà", "mǎ"], a: 1}
words: [你好, 谢谢, 水, 我, 是, 不, 一, 茶, 钱, 再见]
phrases:
  - {h: "你好吗？", p: "nǐ hǎo ma?", o: ["Как дела?", "Сколько стоит?", "Где туалет?"], a: 0}
  - {h: "多少钱？", p: "duōshao qián?", o: ["Как тебя зовут?", "Сколько стоит?", "Спасибо"], a: 1}
  - {h: "我要茶。", p: "wǒ yào chá.", o: ["Я не пью чай", "Я хочу чай", "Чай дорогой"], a: 1}

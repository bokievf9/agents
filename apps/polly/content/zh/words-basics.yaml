topic: basics
title: "Приветствия, вежливость, знакомство"
words:
  - {h: 你好, p: nǐ hǎo, r: "привет, здравствуйте", n: "Два третьих тона подряд: первый читается как второй (ní hǎo), но пишется nǐ hǎo.", e: {h: "你好，很高兴认识你。", p: "nǐ hǎo, hěn gāoxìng rènshi nǐ.", r: "Здравствуйте, рад с вами познакомиться."}}
  - {h: 您好, p: nín hǎo, r: "здравствуйте (вежливо)"}
  - {h: 谢谢, p: xièxie, r: "спасибо", n: "Второй слог лёгкий, без тона: xièxie. Ответ на «спасибо»: 不客气.", e: {h: "谢谢你！", p: "xièxie nǐ!", r: "Спасибо тебе!"}}
  - {h: 不客气, p: bú kèqi, r: "не за что"}
  - {h: 再见, p: zàijiàn, r: "до свидания", n: "Буквально «ещё раз увидимся». Оба слога 4-го тона: резко вниз, как короткая команда.", e: {h: "明天见，再见！", p: "míngtiān jiàn, zàijiàn!", r: "До завтра, до свидания!"}}
  - {h: 对不起, p: duìbuqǐ, r: "простите, извините", n: "Третий слог (qǐ) 3-го тона, второй (bu) лёгкий. Самая нужная фраза путешественника.", e: {h: "对不起，我听不懂。", p: "duìbuqǐ, wǒ tīng bu dǒng.", r: "Простите, я не понимаю."}}
  - {h: 没关系, p: méi guānxi, r: "ничего страшного", n: "Ответ на извинение. Второй слог 关 (guān) 1-го тона, последний лёгкий.", e: {h: "没关系，再说一遍。", p: "méi guānxi, zài shuō yí biàn.", r: "Ничего, повторите ещё раз."}}
  - {h: 请, p: qǐng, r: "пожалуйста (просьба)"}
  - {h: 请问, p: qǐngwèn, r: "извините, можно спросить", n: "Вежливое начало любого вопроса незнакомому человеку: 请问 + вопрос.", e: {h: "请问，厕所在哪儿？", p: "qǐngwèn, cèsuǒ zài nǎr?", r: "Извините, где туалет?"}}
  - {h: 是, p: shì, r: "быть, это; да", n: "4-й тон, резко вниз. 是 связывает слова: 我是… («я есть…»). Отдельного слова «да» нет: отвечают 是 или повторяют глагол.", e: {h: "他是我的朋友。", p: "tā shì wǒ de péngyou.", r: "Он мой друг."}}
  - {h: 不, p: bù, r: "не, нет", n: "Перед словом 4-го тона 不 читается bú (не bù): 不是 bú shì, 不客气 bú kèqi.", e: {h: "我不会说汉语。", p: "wǒ bú huì shuō Hànyǔ.", r: "Я не умею говорить по-китайски."}}
  - {h: 好, p: hǎo, r: "хорошо"}
  - {h: 好的, p: hǎo de, r: "хорошо, ладно"}
  - {h: 我, p: wǒ, r: "я", n: "3-й тон: опускается и поднимается. В потоке речи обычно только опускается.", e: {h: "我很好。", p: "wǒ hěn hǎo.", r: "У меня всё хорошо."}}
  - {h: 你, p: nǐ, r: "ты"}
  - {h: 您, p: nín, r: "вы (вежливо)"}
  - {h: 他, p: tā, r: "он"}
  - {h: 她, p: tā, r: "она"}
  - {h: 我们, p: wǒmen, r: "мы"}
  - {h: 你们, p: nǐmen, r: "вы (мн.)"}
  - {h: 的, p: de, r: "частица принадлежности (моё, твоё)"}
  - {h: 叫, p: jiào, r: "называться, звать", n: "Шаблон знакомства: 我叫 + имя. Тон 4: резко вниз.", e: {h: "我叫阿里。", p: "wǒ jiào Ālǐ.", r: "Меня зовут Али."}}
  - {h: 名字, p: míngzi, r: "имя", n: "Второй слог лёгкий. Вопрос об имени: 你叫什么名字？", e: {h: "你叫什么名字？", p: "nǐ jiào shénme míngzi?", r: "Как тебя зовут?"}}
  - {h: 什么, p: shénme, r: "что, какой"}
  - {h: 谁, p: shéi, r: "кто"}
  - {h: 人, p: rén, r: "человек", n: "2-й тон, как вопросительное «а?». 国 + 人 даёт национальность: 中国人 китаец.", e: {h: "你是哪国人？", p: "nǐ shì nǎ guó rén?", r: "Ты из какой страны?"}}
  - {h: 哪, p: nǎ, r: "какой, который"}
  - {h: 国, p: guó, r: "страна"}
  - {h: 中国, p: Zhōngguó, r: "Китай"}
  - {h: 俄罗斯, p: Èluósī, r: "Россия"}
  - {h: 认识, p: rènshi, r: "знакомиться, знать (человека)"}
  - {h: 高兴, p: gāoxìng, r: "рад, радостный"}
  - {h: 会, p: huì, r: "уметь, мочь (по навыку)"}
  - {h: 说, p: shuō, r: "говорить"}
  - {h: 汉语, p: Hànyǔ, r: "китайский язык"}
  - {h: 英语, p: Yīngyǔ, r: "английский язык"}
  - {h: 懂, p: dǒng, r: "понимать"}
  - {h: 听不懂, p: tīng bu dǒng, r: "не понимаю на слух"}
  - {h: 也, p: yě, r: "тоже"}
  - {h: 很, p: hěn, r: "очень"}
  - {h: 吗, p: ma, r: "частица вопроса (да/нет)"}
  - {h: 呢, p: ne, r: "а ты? (встречный вопрос)"}
  - {h: 了, p: le, r: "частица завершённого действия"}

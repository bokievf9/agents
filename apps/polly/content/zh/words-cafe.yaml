topic: cafe
title: "Кафе и еда"
words:
  - {h: 要, p: yào, r: "хотеть, нужно; заказать", n: "Для заказа достаточно: 我要 + что. Коротко и вежливо, если добавить 请 или 谢谢.", e: {h: "我要一杯水。", p: "wǒ yào yì bēi shuǐ.", r: "Мне стакан воды."}}
  - {h: 水, p: shuǐ, r: "вода", n: "3-й тон. Китайцы часто пьют горячую воду, поэтому 热水: обычная просьба.", e: {h: "请给我一杯热水。", p: "qǐng gěi wǒ yì bēi rè shuǐ.", r: "Дайте мне, пожалуйста, стакан горячей воды."}}
  - {h: 茶, p: chá, r: "чай", n: "2-й тон, вверх. Чашку чая: 一杯茶.", e: {h: "一杯茶，谢谢。", p: "yì bēi chá, xièxie.", r: "Чашку чая, спасибо."}}
  - {h: 吃, p: chī, r: "есть, кушать", n: "1-й тон: ровно и высоко. 想吃: «хочу съесть».", e: {h: "我想吃面条。", p: "wǒ xiǎng chī miàntiáo.", r: "Я хочу лапшу."}}
  - {h: 饭, p: fàn, r: "еда, варёный рис", n: "4-й тон. 吃饭: «поесть». Привычная забота в приветствии: 你吃饭了吗？", e: {h: "你吃饭了吗？", p: "nǐ chī fàn le ma?", r: "Ты поел?"}}
  - {h: 好吃, p: hǎochī, r: "вкусный (о еде)", n: "Буквально «хорошо есть». Похвала еде.", e: {h: "这个很好吃！", p: "zhège hěn hǎochī!", r: "Это очень вкусно!"}}
  - {h: 菜单, p: càidān, r: "меню", n: "Просьба: 请给我菜单. Оба слога 4-го и 1-го тона.", e: {h: "请给我菜单。", p: "qǐng gěi wǒ càidān.", r: "Дайте мне, пожалуйста, меню."}}
  - {h: 买单, p: mǎidān, r: "счёт, оплатить счёт", n: "Это слово говорят официанту, чтобы попросить счёт.", e: {h: "服务员，买单！", p: "fúwùyuán, mǎidān!", r: "Официант, счёт!"}}
  - {h: 喝, p: hē, r: "пить"}

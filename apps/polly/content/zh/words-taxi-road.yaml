topic: taxi_road
title: "Такси, транспорт, дорога"
words:
  - {h: 去, p: qù, r: "идти, ехать (туда)", n: "4-й тон, резко вниз. Шаблон для такси: 我要去 + место.", e: {h: "我要去机场。", p: "wǒ yào qù jīchǎng.", r: "Мне нужно в аэропорт."}}
  - {h: 这里, p: zhèlǐ, r: "здесь, сюда", n: "Покажите адрес в телефоне и скажите: 去这里. Второй слог 3-го тона.", e: {h: "请到这里。", p: "qǐng dào zhèlǐ.", r: "Пожалуйста, (довезите) сюда."}}
  - {h: 酒店, p: jiǔdiàn, r: "отель", n: "3-й тон перед 4-м читается коротко и низко, без подъёма.", e: {h: "我去这个酒店。", p: "wǒ qù zhège jiǔdiàn.", r: "Мне в этот отель."}}
  - {h: 左, p: zuǒ, r: "левый, налево", n: "3-й тон. Левый и правый: 左 и 右 (оба с одним звуком «ю» в конце, но тоны разные).", e: {h: "请往左拐。", p: "qǐng wǎng zuǒ guǎi.", r: "Поверните, пожалуйста, налево."}}
  - {h: 右, p: yòu, r: "правый, направо", n: "4-й тон, резко вниз.", e: {h: "前面右拐。", p: "qiánmiàn yòu guǎi.", r: "Впереди направо."}}
  - {h: 停, p: tíng, r: "остановиться", n: "2-й тон, вверх. Команда водителю: 在这儿停.", e: {h: "在这儿停，谢谢。", p: "zài zhèr tíng, xièxie.", r: "Остановите здесь, спасибо."}}
  - {h: 在, p: zài, r: "находиться, в, на", n: "4-й тон. Формула места: предмет + 在 + место. Не путайте с 再 (опять): тот же звук, другой иероглиф.", e: {h: "我在这儿。", p: "wǒ zài zhèr.", r: "Я здесь."}}
  - {h: 哪儿, p: nǎr, r: "где, куда", n: "Вопрос «где?»: предмет + 在哪儿？ На юге Китая чаще говорят 哪里 (nǎlǐ).", e: {h: "洗手间在哪儿？", p: "xǐshǒujiān zài nǎr?", r: "Где туалет?"}}
  - {h: 地铁站, p: dìtiězhàn, r: "станция метро", n: "Три части: 地铁 (метро) + 站 (станция). Четыре слога, тоны 4-3-3-4.", e: {h: "地铁站远吗？", p: "dìtiězhàn yuǎn ma?", r: "Станция метро далеко?"}}
  - {h: 来, p: lái, r: "приходить, ехать сюда"}
  - {h: 到, p: dào, r: "приезжать, до"}
  - {h: 这儿, p: zhèr, r: "здесь"}
  - {h: 那儿, p: nàr, r: "там"}
  - {h: 前, p: qián, r: "перед, впереди"}

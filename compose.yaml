# Runs on the server as a dedicated user in /opt/fir-agents. The installed copy is root-owned
# (docker group access is root-equivalent): never take compose.yaml from the CI client.
# Installed by deploy/bootstrap-vps.sh into /opt/fir-agents. Not deployed yet: there is no server. __AGENTS_UID__/__AGENTS_GID__ are filled in by the bootstrap script.
name: fir-agents
services:
  lead-intake:
    image: ghcr.io/bokievf9/agents-lead-intake:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WEBHOOK_PORT: "8787"
      LLM_BASE_URL: http://omniroute:20128
      TZ: Asia/Tashkent
    volumes:
      - /opt/fir-agents/data/lead-intake:/app/data
    # The only published port: the form webhook, loopback only; nginx proxies to it later.
    ports:
      - "127.0.0.1:8787:8787"
    networks: [agents-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  # Polly: personal language teacher (stage 1, text). No published ports: it only polls Telegram.
  # POLLY_BOT_TOKEN and OWNER_TELEGRAM_ID come from .env; the lesson content is baked into the image.
  polly:
    image: ghcr.io/bokievf9/agents-polly:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LLM_BASE_URL: http://omniroute:20128
      TZ: Asia/Kuala_Lumpur
    volumes:
      - /opt/fir-agents/data/polly:/app/data
    networks: [agents-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  # LLM gateway: internal network only, no published ports. Secrets (JWT_SECRET, API_KEY_SECRET, provider keys)
  # live in /opt/fir-agents/omniroute.env; lead-intake authenticates with LLM_API_KEY from .env.
  # Not read_only: the image is not verified for it yet (tighten after the first run on the server).
  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file:
      - path: omniroute.env
        required: false
    environment:
      REQUIRE_API_KEY: "true"
      DATA_DIR: /app/data
      PORT: "20128"
    volumes:
      - /opt/fir-agents/data/omniroute:/app/data
    expose:
      - "20128"
    # fir-llm: external network shared with the Dono compose project (LLM_BASE_URL=http://omniroute:20128).
    networks: [agents-net, fir-llm]
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1.5g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
networks:
  agents-net:
    driver: bridge
  # Created by deploy/bootstrap-vps.sh; shared with Dono (/opt/dono/compose.yaml). Compose only attaches.
  fir-llm:
    external: true

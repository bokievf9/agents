# Runs on the server as a dedicated user in /opt/fir-agents. The installed copy is root-owned
# (docker group access is root-equivalent): never take compose.yaml from the CI client.
# Installed by deploy/bootstrap-vps.sh into /opt/fir-agents (root-owned; after a change here, root copies it again). __AGENTS_UID__/__AGENTS_GID__ are filled in by the bootstrap script.
name: fir-agents
services:
  # Polly: personal language teacher (stage 1, text). No published ports: it only polls Telegram.
  # POLLY_BOT_TOKEN and OWNER_TELEGRAM_ID come from .env; the lesson content is baked into the image.
  polly:
    image: ghcr.io/bokievf9/agents-polly:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LLM_BASE_URL: http://omniroute:20128
      TZ: Asia/Kuala_Lumpur
    volumes:
      - /opt/fir-agents/data/polly:/app/data
    networks: [agents-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  # HQ: the Director bot plus all department heads in one process and one SQLite (docs/architecture-hq.md, stages 1-2:
  # Marketing, Sales). HQ_BOT_TOKEN, OWNER_TELEGRAM_ID, optionally MARKETING_BOT_TOKEN, SALES_BOT_TOKEN, LEAD_WEBHOOK_TOKEN,
  # HQ_GROUP_ID, HQ_TOPICS come from .env; the instructions and prompts are baked into the image.
  # The only published port: the lead webhook (POST /lead from firtech.pro on the same host), loopback only.
  hq:
    image: ghcr.io/bokievf9/agents-hq:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LLM_BASE_URL: http://omniroute:20128
      TZ: Asia/Tashkent
    volumes:
      - /opt/fir-agents/data/hq:/app/data
      # Docker check of the Support head (MONITOR_DOCKER=true). OFF: the docker socket is root-equivalent on the host,
      # and ":ro" does not limit the API. Enable only knowing that; the container user also needs the docker group
      # (group_add), which the hardening above does not give it.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8787:8787"
    networks: [agents-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    # GET /health inside the container; `docker compose ps` shows (healthy), the monitoring reads it with MONITOR_DOCKER.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  # Renderer: faceless reels (Remotion + Chromium + Piper voice) for the reels HQ queues in `cm_render_jobs`. Polls the HQ SQLite
  # file in the shared data dir every RENDERER_POLL_SECONDS and writes data/renders/<item>/reel.mp4. One container, one job at a time.
  # No secrets and no network: the browser, the voice and the fonts are baked into the image. Not verified on a server yet
  # (Chromium needs its sandbox off inside the container, shm and tmpfs sizes are first guesses): see packages/renderer/README.md.
  renderer:
    image: ghcr.io/bokievf9/agents-renderer:latest
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    environment:
      DATA_DIR: /app/data
      RENDERER_POLL_SECONDS: "20"
      PIPER_VOICE: ru_RU-denis-medium
      TZ: Asia/Tashkent
    volumes:
      - /opt/fir-agents/data/hq:/app/data
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    # The renderer touches data/renderer.heartbeat every 30 s (also while it renders): stale for 2 minutes means stuck or dead.
    healthcheck:
      test: ["CMD", "node", "-e", "const s = require('fs').statSync('/app/data/renderer.heartbeat'); process.exit(Date.now() - s.mtimeMs < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  # LLM gateway: internal network only, no published ports. Secrets (JWT_SECRET, API_KEY_SECRET, provider keys)
  # live in /opt/fir-agents/omniroute.env; the agents authenticate with LLM_API_KEY from .env.
  # Not read_only: the image is not verified for it yet (tighten after the first run on the server).
  # The image is pinned by digest, never by a moving tag (audit 2026-11-19): everything the agents say passes through it
  # and it holds the provider keys. Digest of diegosouzapw/omniroute:latest on 2026-11-19 (multi-arch index, linux/amd64
  # and arm64). Update only by hand after reading the changelog: docs/omniroute-image.md.
  omniroute:
    image: diegosouzapw/omniroute@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68
    restart: unless-stopped
    user: "__AGENTS_UID__:__AGENTS_GID__"
    env_file:
      - path: omniroute.env
        required: false
    environment:
      REQUIRE_API_KEY: "true"
      DATA_DIR: /app/data
      PORT: "20128"
    volumes:
      - /opt/fir-agents/data/omniroute:/app/data
    expose:
      - "20128"
    # fir-llm: external network shared with the Dono compose project (LLM_BASE_URL=http://omniroute:20128).
    networks: [agents-net, fir-llm]
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1.5g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  agents-net:
    driver: bridge
  # Created by deploy/bootstrap-vps.sh; shared with Dono (/opt/dono/compose.yaml). Compose only attaches.
  fir-llm:
    external: true
